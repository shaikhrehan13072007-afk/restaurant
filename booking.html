<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Restaurant Website</title>
    <title> background image</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

    <div class="row">
      <div class="left"><h1 style="text-align: left;">Welcome to umar Restaurant</h1></div>

               
           <div class="right"> <a href="index.html" style="padding: 10px; color: black;">Home</a>
                <a href="menu.html" style="padding: 10px; color: black;">Menu</a>
                <a href="about.html" style="padding: 10px; color: black;">About Us</a>
                <a href="booking.html" style="padding: 10px; color: black;">Booking</a>
                <a href="contact.html" style="padding: 10px; color: black;">Contact</a>
            </div>
    </div>
                
        <marquee behavior="scroll" direction="left" scrollamount="10">
            <h2 style="font-family: italic;">Welcome to Umar Restaurant - Where Taste Meets Tradition!</h2>
        </marquee>
    </header>

    <input type="text" placeholder="Enter your name" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <input type="tel" placeholder="Enter your phone number" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <input type="number" placeholder="Number of guests" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <input type="email" placeholder="Enter your email" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <input type="date" placeholder="Select date" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <input type="time" placeholder="Select time" style="display: block; margin: 20px auto; padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    <button onclick="alert('Your booking has been submitted!')" style="display: block; margin: 20px auto; padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">Book Now</button>


    <br>
    
    <footer>
        <p style="background-color: black; color: white; text-align: center;">&copy; 2026 Our Restaurant. All rights reserved.</p>
    </footer>
